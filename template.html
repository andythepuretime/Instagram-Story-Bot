<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1920px;
    position: relative;
    background: #2a2016;
  }

  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 60% 40%;
  }

  /* 顶部深色渐变，保证 logo + 标题可读 */
  .scrim-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 780px;
    background: linear-gradient(180deg, rgba(20,14,8,0.72) 0%, rgba(20,14,8,0.55) 40%, rgba(20,14,8,0.0) 100%);
  }

  /* 底部深色渐变，保证卡片+按钮清晰 */
  .scrim-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 950px;
    background: linear-gradient(0deg, rgba(20,14,8,0.80) 0%, rgba(20,14,8,0.55) 45%, rgba(20,14,8,0.0) 100%);
  }

  .logo {
    position: absolute;
    top: 86px;
    left: 0;
    right: 0;
    text-align: center;
  }
  .logo img {
    height: 190px;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.45));
  }

  .headline {
    position: absolute;
    top: 360px;
    left: 0;
    right: 0;
    text-align: center;
  }

  .headline .avail {
    display:block;
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 82px;
    letter-spacing: 6px;
    color: #e9c98a;
    text-transform: uppercase;
    text-shadow: 0 6px 24px rgba(0,0,0,0.4);
    line-height: 1.15;
  }

  .headline .appt {
    display:block;
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 82px;
    letter-spacing: 6px;
    color: #e9c98a;
    text-transform: uppercase;
    margin-top: 0;
    text-shadow: 0 6px 24px rgba(0,0,0,0.4);
    line-height: 1.15;
  }

  .date-line {
    position: absolute;
    top: 630px;
    left: 0;
    right: 0;
    text-align: center;
  }

  .date-line .combined {
    display:inline-block;
    font-family: 'Poppins', sans-serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fffaf2;
    text-shadow: 0 4px 16px rgba(0,0,0,0.55);
  }

  .card {
    position: absolute;
    top: 770px;
    left: 190px;
    width: 700px;
    background: rgba(25, 18, 10, 0.30);
    backdrop-filter: blur(22px) saturate(1.1);
    -webkit-backdrop-filter: blur(22px) saturate(1.1);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 40px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    padding: 44px 60px 36px 60px;
  }

  .card .slot {
    text-align: center;
    padding: 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.20);
  }
  .card .slot:last-child { border-bottom: none; }

  .card .slot .t {
    font-family: 'Lora', serif;
    font-size: 52px;
    color: #fffaf2;
    font-weight: 600;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .card .slot .t .ampm {
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 1px;
    margin-left: 4px;
  }
  .card .slot .s {
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: #f0d9a0;
    margin-top: 4px;
    text-transform: uppercase;
    font-weight: 600;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  .empty-msg {
    text-align: center;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 36px;
    color: #a8783a;
    padding: 60px 0;
  }

  .bottom-bar {
    position: absolute;
    bottom: 130px;
    left: 190px;
    width: 700px;
    background: linear-gradient(90deg, #9c6f31, #d0a860 50%, #9c6f31);
    border-radius: 60px;
    padding: 28px 0;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }
  .bottom-bar span {
    font-size: 30px;
    letter-spacing: 1px;
    color: #fffaf0;
    font-weight: 700;
  }

  .footer-logo {
    position: absolute;
    bottom: 58px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 17px;
    letter-spacing: 8px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg-photo" src="{{BG_PHOTO_PATH}}" />
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="logo">
      <img src="{{LOGO_PATH}}" />
    </div>

    <div class="headline">
      <span class="appt">Appointments</span>
      <span class="avail">Available</span>
    </div>

    <div class="date-line">
      <span class="combined">{{REL_DAY}} · {{FULL_DATE}}</span>
    </div>

    <div class="card">
      {{SLOTS_HTML}}
    </div>

    <div class="bottom-bar">
      <span>BOOK NOW — LINK IN BIO</span>
    </div>

    <div class="footer-logo">LUXURY HEAD SPA · FACIAL · FOOT WELLNESS</div>
  </div>
</body>
</html>
